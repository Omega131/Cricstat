version: '3.8'

services:
  cricstat-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipl_cricstat
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/summary"]
      interval: 30s
      timeout: 10s
      retries: 3
